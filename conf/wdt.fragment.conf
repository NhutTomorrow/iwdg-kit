# Product today: CONFIG_WATCHDOG=y but CONFIG_WDT_DISABLE_AT_BOOT=y
# because nothing feeds IWDG yet (default ~100 ms → reset loop).
#
# After this module works, production should:
#   CONFIG_WATCHDOG=y
#   # CONFIG_WDT_DISABLE_AT_BOOT is not set  (or =n)
# and call wdt_token_init() only after init is far enough that feed starts promptly.

CONFIG_WATCHDOG=y
CONFIG_IWDG_STM32_INITIAL_TIMEOUT=4000
CONFIG_REBOOT=y
CONFIG_GPIO=y
CONFIG_PRINTK=y

# Cau hinh USB Virtual COM Port (CDC ACM) de doc log qua cong Type-C
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="STM32F407 IWDG"
CONFIG_USB_DEVICE_VID=0x2FE3
CONFIG_USB_DEVICE_PID=0x0100
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_LINE_CTRL=y